<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NeuroPed-Hub: Hub de escalas neuropediátricas do Dr. Giovani Anton Petró">
  <title>NeuroPed-Hub | Dr. Giovani Anton Petró</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="38" height="38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="2"/>
            <path d="M14 26c1.5-6 4-9 6-9s2.5 5 4 5 2-7 4-7 3 8 4 8 2-3 4-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>NeuroPed-Hub</h1>
          <p class="subtitle">Dr. Giovani Anton Petró — Neuropediatra</p>
        </div>
      </div>
    </div>

    <div class="search-bar-wrap">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Buscar escala (ex.: autismo, sono, motor)..." autocomplete="off" />
        <button id="clearSearch" class="clear-btn" aria-label="Limpar busca" hidden>×</button>
      </div>
      <p id="resultCount" class="result-count"></p>
    </div>
  </header>

  <main>
    <div id="categoriesContainer"></div>
    <div id="emptyState" class="empty-state" hidden>
      <p>Nenhuma escala encontrada para essa busca.</p>
      <p style="font-size: 0.9rem; margin-top: 10px; opacity: 0.7;">Tente usar outros termos ou navegue pelas categorias.</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>NeuroPed-Hub &middot; Uso clínico interno &middot; Ambulatório de Neuropediatria HUSM</p>
  </footer>

  <script src="assets/scales-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
